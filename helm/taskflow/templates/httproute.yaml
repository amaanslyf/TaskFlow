{{- if and .Values.gateway.enabled .Values.gateway.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.httpRoute.name | default "taskflow-frontend-route" }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "taskflow-gateway" }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.httpRoute.pathType | default "PathPrefix" }}
            value: {{ .Values.gateway.httpRoute.path | default "/" }}
      backendRefs:
        - name: {{ .Values.frontend.service.name | default "frontend" }}
          port: {{ .Values.frontend.service.port | default 80 }}
{{- end }}
