apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.service.name | default "postgres" }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: {{ .Values.postgres.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: {{ .Values.postgres.service.targetPort | default 5432 }}
