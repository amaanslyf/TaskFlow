apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.service.name | default "backend" }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        {{- include "taskflow.labels" . | nindent 8 }}
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
        fsGroup: {{ .Values.backend.securityContext.fsGroup }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port | default 8080 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default "taskflow-secrets" | quote }}
                  key: {{ .Values.secret.keys.databaseUrl | default "DATABASE_URL" | quote }}
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskflow.fullname" . }}-config
                  key: PORT
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskflow.fullname" . }}-config
                  key: FRONTEND_ORIGIN
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path | default "/healthz" }}
              port: {{ .Values.backend.service.port | default 8080 }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path | default "/readyz" }}
              port: {{ .Values.backend.service.port | default 8080 }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold | default 3 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.backend.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.backend.securityContext.dropCapabilities | nindent 16 }}
