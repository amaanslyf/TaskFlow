{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | default "taskflow-gateway" }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | default "traefik-gateway-class" }}
  listeners:
    - name: http
      protocol: {{ .Values.gateway.protocol | default "HTTP" }}
      port: {{ .Values.gateway.port | default 80 }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
