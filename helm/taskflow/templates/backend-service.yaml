apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name | default "backend" }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port | default 8080 }}
      targetPort: {{ .Values.backend.service.targetPort | default 8080 }}
