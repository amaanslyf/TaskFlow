name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── Job 1: Go Unit Testing ────────────────────────────────
  go-unit:
    name: Go Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Run Go Unit Tests with Race Detection & Coverage
        working-directory: backend
        run: go test -v -race -cover ./...

      - name: Run Go Vet Static Analysis
        working-directory: backend
        run: go vet ./...

  # ── Job 2: Frontend Production Build ───────────────────────
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Install NPM Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Production SPA
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

  # ── Job 3: API Integration Tests (pytest) ─────────────────
  api-integration:
    name: API Integration Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/api/requirements.txt

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Database Schema
        run: PGPASSWORD=ci_only_password psql -h localhost -U postgres -d taskflow -f database/schema.sql

      - name: Start Backend and Run API Integration Tests
        run: |
          set -euo pipefail

          # 1. Build the Go executable into $RUNNER_TEMP
          echo "Building Go backend executable..."
          (cd backend && go build -o "$RUNNER_TEMP/taskflow-api" ./cmd/api)

          # 2. Launch that executable in the background
          echo "Starting Go backend in background..."
          DATABASE_URL="postgres://postgres:ci_only_password@localhost:5432/taskflow?sslmode=disable" \
          PORT=8080 \
          FRONTEND_ORIGIN="http://localhost:5173" \
          "$RUNNER_TEMP/taskflow-api" > backend.log 2>&1 &
          BACKEND_PID=$!

          # 3 & 4. Register shell EXIT trap for cleanup and failure logging
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "=== Process failed (exit code: $exit_code). Printing backend.log ==="
              if [ -f backend.log ]; then
                cat backend.log
              fi
            fi
            if [ -n "${BACKEND_PID:-}" ] && kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Stopping Go backend (PID: $BACKEND_PID)..."
              kill "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # 5. Wait for /healthz to return HTTP 200
          echo "Waiting for Go backend /healthz..."
          ready=false
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "Backend is ready on http://localhost:8080/healthz!"
              ready=true
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "ERROR: Backend process exited prematurely!"
              exit 1
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: Backend failed to become healthy within 30 seconds."
            exit 1
          fi

          # 6. Install pytest dependencies
          pip install -r tests/api/requirements.txt

          # 7. Run pytest
          API_BASE_URL=http://localhost:8080 python -m pytest -c tests/api/pytest.ini tests/api -v

      - name: Print Backend Logs on Failure
        if: failure()
        run: |
          if [ -f backend.log ]; then
            echo "=== Go Backend Logs ==="
            cat backend.log
          fi

  # ── Job 4: Browser End-to-End Tests (Playwright) ───────────
  browser-e2e:
    name: Browser E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Database Schema
        run: PGPASSWORD=ci_only_password psql -h localhost -U postgres -d taskflow -f database/schema.sql

      - name: Start Backend and Run Playwright Browser Tests
        run: |
          set -euo pipefail

          # 1. Build the Go executable into $RUNNER_TEMP
          echo "Building Go backend executable..."
          (cd backend && go build -o "$RUNNER_TEMP/taskflow-api" ./cmd/api)

          # 2. Launch that executable in the background
          echo "Starting Go backend in background..."
          DATABASE_URL="postgres://postgres:ci_only_password@localhost:5432/taskflow?sslmode=disable" \
          PORT=8080 \
          FRONTEND_ORIGIN="http://localhost:5173" \
          "$RUNNER_TEMP/taskflow-api" > backend.log 2>&1 &
          BACKEND_PID=$!

          # 3 & 4. Register shell EXIT trap for cleanup and failure logging
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "=== Process failed (exit code: $exit_code). Printing backend.log ==="
              if [ -f backend.log ]; then
                cat backend.log
              fi
            fi
            if [ -n "${BACKEND_PID:-}" ] && kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Stopping Go backend (PID: $BACKEND_PID)..."
              kill "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # 5. Wait for /healthz to return HTTP 200
          echo "Waiting for Go backend /healthz..."
          ready=false
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "Backend is ready on http://localhost:8080/healthz!"
              ready=true
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "ERROR: Backend process exited prematurely!"
              exit 1
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: Backend failed to become healthy within 30 seconds."
            exit 1
          fi

          # 6. Install npm dependencies
          (cd frontend && npm ci)

          # 7. Install Playwright Chromium & system dependencies
          (cd frontend && npx playwright install --with-deps chromium)

          # 8. Run Playwright
          (cd frontend && VITE_API_BASE_URL=http://localhost:8080 FRONTEND_ORIGIN=http://localhost:5173 npx playwright test)

      - name: Print Backend Logs on Failure
        if: failure()
        run: |
          if [ -f backend.log ]; then
            echo "=== Go Backend Logs ==="
            cat backend.log
          fi

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ── Job 5: Production Docker Image Build and Publish ───────
  docker-build:
    name: Production Docker Image Build and Publish
    runs-on: ubuntu-latest
    needs:
      - go-unit
      - frontend-build
      - api-integration
      - browser-e2e
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Image Repository Namespace
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPOSITORY_BACKEND=ghcr.io/${OWNER}/taskflow-backend" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY_FRONTEND=ghcr.io/${OWNER}/taskflow-frontend" >> "$GITHUB_ENV"

      - name: Extract Docker Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-

      - name: Extract Docker Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Process Backend Docker Image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=taskflow-backend
          cache-to: type=gha,mode=max,scope=taskflow-backend

      - name: Build and Process Frontend Docker Image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=taskflow-frontend
          cache-to: type=gha,mode=max,scope=taskflow-frontend

      - name: Report Published Image References and Digests
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_REPOSITORY_BACKEND }}
          BACKEND_TAGS: ${{ steps.meta-backend.outputs.tags }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ env.IMAGE_REPOSITORY_FRONTEND }}
          FRONTEND_TAGS: ${{ steps.meta-frontend.outputs.tags }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          IS_PUSH_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "============================================================"
          echo "Docker Build & Publish Execution Summary"
          echo "============================================================"
          echo "Backend Image:   $BACKEND_IMAGE"
          echo "Backend Tags:"
          echo "$BACKEND_TAGS"
          echo "Backend Digest:  $BACKEND_DIGEST"
          echo "------------------------------------------------------------"
          echo "Frontend Image:  $FRONTEND_IMAGE"
          echo "Frontend Tags:"
          echo "$FRONTEND_TAGS"
          echo "Frontend Digest: $FRONTEND_DIGEST"
          echo "============================================================"

          if [ "$IS_PUSH_MAIN" = "true" ]; then
            {
              echo "## 🚀 GitHub Container Registry (GHCR) Publishing Summary"
              echo ""
              echo "Successfully published production container images to **GitHub Container Registry (ghcr.io)**."
              echo ""
              echo "### 📦 Published Images"
              echo ""
              echo "| Component | Repository | Tags | Image Digest |"
              echo "| :--- | :--- | :--- | :--- |"
              echo "| **Backend** | \`$BACKEND_IMAGE\` | \`main\`, \`sha-$COMMIT_SHA\` | \`$BACKEND_DIGEST\` |"
              echo "| **Frontend** | \`$FRONTEND_IMAGE\` | \`main\`, \`sha-$COMMIT_SHA\` | \`$FRONTEND_DIGEST\` |"
              echo ""
              echo "### 📥 Pull Commands (PowerShell / Bash)"
              echo '```powershell'
              echo "docker pull ${BACKEND_IMAGE}:main"
              echo "docker pull ${FRONTEND_IMAGE}:main"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ℹ️ Pull Request Verification Build"
              echo ""
              echo "Container images were successfully **built and verified** in Docker Buildx."
              echo "Publishing to GHCR was **skipped** (image publishing triggers only on push to \`main\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

