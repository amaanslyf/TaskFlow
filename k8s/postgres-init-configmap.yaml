apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-postgres-init
  namespace: taskflow-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
data:
  01-schema.sql: |
    -- ============================================================
    -- TaskFlow Database Schema (Kubernetes Init)
    -- ============================================================
    -- This script runs automatically on first database creation
    -- when mounted into /docker-entrypoint-initdb.d/
    -- ============================================================

    -- Enable UUID generator extension
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Create tasks table
    CREATE TABLE IF NOT EXISTS tasks (
        id          UUID        PRIMARY KEY DEFAULT uuid_generate_v4(),
        title       TEXT        NOT NULL,
        description TEXT        NOT NULL DEFAULT '',
        status      TEXT        NOT NULL DEFAULT 'todo'
                                CHECK (status IN ('todo', 'in_progress', 'completed')),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- Speed up filtered queries on status
    CREATE INDEX IF NOT EXISTS idx_tasks_status ON tasks (status);
