# ============================================================
# TaskFlow Kubernetes Secret Template
# ============================================================
# INSTRUCTIONS:
# 1. Copy this file to `secret.yaml`:
#      cp k8s/secret.example.yaml k8s/secret.yaml
# 2. Update the credentials below with your secure passwords.
# 3. Apply the secret to your Kubernetes cluster:
#      kubectl apply -f k8s/secret.yaml
#
# NOTE: k8s/secret.yaml is ignored by git to avoid committing
# real credentials to source control.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow-lab
  labels:
    app.kubernetes.io/name: taskflow-secrets
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "taskflow"
  # Complete PostgreSQL connection URI for the Go backend
  DATABASE_URL: "postgres://postgres:CHANGE_ME_IN_PRODUCTION@postgres:5432/taskflow?sslmode=disable"
