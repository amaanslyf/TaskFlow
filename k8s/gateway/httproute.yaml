apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow-frontend-route
  namespace: taskflow-lab
  labels:
    app.kubernetes.io/name: taskflow-frontend-route
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - name: taskflow-gateway
      namespace: taskflow-lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
