apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taskflow-gateway
  namespace: taskflow-lab
  labels:
    app.kubernetes.io/name: taskflow-gateway
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
spec:
  gatewayClassName: traefik-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
