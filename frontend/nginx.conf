# ============================================================
# TaskFlow Frontend — Nginx Configuration for React SPA
# ============================================================
# Single Page Applications (SPAs) like React need a special
# routing rule: when a user refreshes the page on a path like
# "/tasks/123", Nginx must return "index.html" so that React
# Router can handle the path in the browser instead of Nginx
# returning an HTTP 404 (File Not Found) error.
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Nginx web root where our static React bundle is copied.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression to reduce network payload sizes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Cache immutable static assets generated by Vite (with hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing:
    # First check if the requested URL matches a physical file ($uri).
    # Next check if it matches a directory ($uri/).
    # If neither exists, fall back to /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling for unexpected server errors.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

