# ============================================================
# TaskFlow Frontend — Nginx Configuration for React SPA & Reverse Proxy
# ============================================================
# Responsibilities:
#   1. Serve static React assets and route unknown paths to /index.html (SPA).
#   2. Reverse-proxy /api/ requests to the Go backend container (http://backend:8080).
# ============================================================

server {
    listen 80;
    server_name _;

    # Nginx web root where our static React bundle is copied.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression to reduce network payload sizes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Cache immutable static assets generated by Vite (with hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy API requests to the Go backend container.
    # Note: proxy_pass specifies ONLY the backend host and port (no trailing slash),
    # preserving the full original request URI (e.g. /api/v1/tasks).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing:
    # First check if the requested URL matches a physical file ($uri).
    # Next check if it matches a directory ($uri/).
    # If neither exists, fall back to /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling for unexpected server errors.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

